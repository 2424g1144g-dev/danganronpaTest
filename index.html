<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <img id="background-layer" src="assets/BG/gym.png">

    <div class="text">これはサンプルテキストだよ、メギドラオンでございます。123456789</div>
    <div id="enemy-name-parent">
        <div id="enemy-name"></div>
    </div>
    <div class="icon" id="mitsuhiro-icon" style="top: 20vh;">
        <img class="icon-src" src="assets/icon/Mitsuhiro_Normal.png">
        <div class="icon-BG"></div>
        <div id="bar-parent">
            <div class="bar-flame">
                <div id="hp-fill" class="mHp" style="width: 100%"></div>
                <div id="hp-fillBG" style="width: 100%;"></div>
            </div>
            <div class="bar-flame" style="left: 53px; width: 130px;">
                <div id="sp-fill" class="mSp"style="width: 100%; left: 10px;"></div>
                <div id="sp-fillBG" style="width: 100%; left: 10px;"></div>
            </div>
        </div>
        <div id="mHpDis" class="hp-display">
            <!-- 百の位、十の位、一の位をそれぞれspanで囲む -->
            <span id="hp-100" class="digit hp-100">3</span>
            <span id="hp-10" class="digit hp-10">2</span>
            <span id="hp-1" class="digit hp-1">7</span>
        </div>
        <div id="mSpDis" class="mp-display">
            <!-- 百の位、十の位、一の位をそれぞれspanで囲む -->
            <span id="mp-100" class="digit sp-100">1</span>
            <span id="mp-10" class="digit sp-10">1</span>
            <span id="mp-1" class="digit sp-1">5</span>
        </div>
    </div>
    <div class="icon" id="ryuji-icon" style="top: 38vh;">
        <img class="icon-src" src="assets/icon/Ryuji_Normal.png">
        <div class="icon-BG"></div>
        <div id="bar-parent">
            <div class="bar-flame">
                <div id="hp-fill" style="width: 100%"></div>
                <div id="hp-fillBG" style="width: 100%;"></div>
            </div>
            <div class="bar-flame" style="left: 53px; width: 130px;">
                <div id="sp-fill" style="width: 100%; left: 10px;"></div>
                <div id="sp-fillBG" style="width: 100%; left: 10px;"></div>
            </div>
        </div>
        <div class="hp-display">
            <!-- 百の位、十の位、一の位をそれぞれspanで囲む -->
            <span id="hp-100" class="digit">2</span>
            <span id="hp-10" class="digit">6</span>
            <span id="hp-1" class="digit">9</span>
        </div>
        <div class="mp-display">
            <!-- 百の位、十の位、一の位をそれぞれspanで囲む -->
            <span id="mp-100" class="digit">1</span>
            <span id="mp-10" class="digit">4</span>
            <span id="mp-1" class="digit">7</span>
        </div>
    </div>
    <div class="icon" id="keizo-icon" style="top: 58vh;">
        <img class="icon-src" src="assets/icon/Keizo_Normal.png">
        <div class="icon-BG"></div>
        <div id="bar-parent">
            <div class="bar-flame">
                <div id="hp-fill" style="width: 100%"></div>
                <div id="hp-fillBG" style="width: 100%;"></div>
            </div>
            <div class="bar-flame" style="left: 53px; width: 130px;">
                <div id="sp-fill" style="width: 100%; left: 10px;"></div>
                <div id="sp-fillBG" style="width: 100%; left: 10px;"></div>
            </div>
        </div>
        <div class="hp-display">
            <!-- 百の位、十の位、一の位をそれぞれspanで囲む -->
            <span id="hp-100" class="digit">3</span>
            <span id="hp-10" class="digit">0</span>
            <span id="hp-1" class="digit">8</span>
        </div>
        <div class="mp-display">
            <!-- 百の位、十の位、一の位をそれぞれspanで囲む -->
            <span id="mp-100" class="digit">1</span>
            <span id="mp-10" class="digit">2</span>
            <span id="mp-1" class="digit">4</span>
        </div>
    </div>
    <div id="command">
        <img id="command-img">
        <div id="moon-joint">
            <div id="moon"></div>
            <div id="moon-command">COMMAND</div>
        </div>
    </div>
    <div id="command-parent">
        <div id="command-circle"></div>
        <div class="key" style="left: 40px; top: 30px;">W</div>
        <div class="keyword" style="left: -90px; top: 5px; font-size: 40px;">PERSONA
            <div class="subword" style="left: 90px; top: -15px;">スキル</div>
        </div>
        <div class="key" style="left: 10px; top: 60px;">A</div>
        <div class="keyword" style="left: -70px; top: 68px; font-size: 35px;">ITEM
            <div class="subword" style="left: 40px; top: -15px;">アイテム</div>
        </div>
        <div class="key" style="left: 40px; top: 90px;">S</div>
        <div class="keyword" style="left: 100px; top: 47px; font-size: 35px;">GUARD
            <div class="subword" style="left: 10px; top: -15px;">防御</div>
        </div>
        <div class="key" style="left: 70px; top: 60px;">D</div>
        <div class="keyword" style="left: 50px; top: 95px; font-size: 50px;">ATTACK
            <div class="subword" style="left: 40px; top: -20px;">攻撃</div>
        </div>
    </div>


    <div id="battlefield">
        <div class="enemy">
            <img style="position: relative; left: 50vw; top: 50vh; width: 400px; transform-origin: bottom; transform: translate(-50%, -50%); animation: enemyWait 1s linear infinite alternate-reverse;" src="assets/characters/enemies/FakeFuruichi_Normal.png">
            <div class="reticle">
                <div class="reticle-wave"></div>
            </div>
            <div class="enemy-hp-wave"></div>
            <div class="enemy-hp-bar">
                <div id="enemy-hp-fill" style="width: 100%;"></div>
            </div>
        </div>
    </div>



    <div class="image-preload-container" aria-hidden="true">
        <!-- 背景 -->
        <img src="assets/BG/gym.png" loading="eager">
    
        <!-- アイコン類 -->
        <img src="assets/icon/Keizo_Normal.png" loading="eager">
        <img src="assets/icon/Ryuji_Normal.png" loading="eager">
        <img src="assets/icon/Mitsuhiro_Normal.png" loading="eager">
    
        <!-- 立ち絵・敵 -->
        <img src="assets/characters/mitsuhiro/Mitsuhiro_Normal.png" loading="eager">
        <img src="assets/characters/mitsuhiro/Mitsuhiro_behind.png" loading="eager">
        <img src="assets/characters/keizo/Keizo_behind.png" loading="eager">
        <img src="assets/characters/ryuji/Ryuji_behind.png" loading="eager">
        <img src="assets/characters/enemies/FakeFuruichi_Normal.png" loading="eager">
    </div>
    


    <script src="main.js"></script>
    <script src="status.js"></script>
    <script src="order.js"></script>
</body>
</html>
