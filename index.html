<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <img id="background-layer" src="assets/BG/gym.png">

    <div class="text">これはサンプルテキストだよ、メギドラオンでございます。123456789</div>
    <div class="icon" id="mitsuhiro-icon" style="top: 20vh;">
        <img class="icon-src" src="assets/icon/Mitsuhiro_Normal.png">
        <div class="icon-BG"></div>
        <div id="bar-parent">
            <div class="bar-flame">
                <div id="hp-fill" style="width: 100%"></div>
                <div id="hp-fillBG" style="width: 100%;"></div>
            </div>
            <div class="bar-flame" style="left: 53px; width: 130px;">
                <div id="sp-fill" style="width: 100%; left: 10px;"></div>
                <div id="sp-fillBG" style="width: 100%; left: 10px;"></div>
            </div>
        </div>
        <div class="hp-display">
            <!-- 百の位、十の位、一の位をそれぞれspanで囲む -->
            <span id="hp-100" class="digit">3</span>
            <span id="hp-10" class="digit">2</span>
            <span id="hp-1" class="digit">7</span>
        </div>
        <div class="mp-display">
            <!-- 百の位、十の位、一の位をそれぞれspanで囲む -->
            <span id="mp-100" class="digit">1</span>
            <span id="mp-10" class="digit">1</span>
            <span id="mp-1" class="digit">5</span>
        </div>
    </div>
    <div class="icon" id="ryuji-icon" style="top: 38vh;">
        <img class="icon-src" src="assets/icon/Ryuji_Normal.png">
        <div class="icon-BG"></div>
        <div id="bar-parent">
            <div class="bar-flame">
                <div id="hp-fill" style="width: 100%"></div>
                <div id="hp-fillBG" style="width: 100%;"></div>
            </div>
            <div class="bar-flame" style="left: 53px; width: 130px;">
                <div id="sp-fill" style="width: 100%; left: 10px;"></div>
                <div id="sp-fillBG" style="width: 100%; left: 10px;"></div>
            </div>
        </div>
        <div class="hp-display">
            <!-- 百の位、十の位、一の位をそれぞれspanで囲む -->
            <span id="hp-100" class="digit">2</span>
            <span id="hp-10" class="digit">6</span>
            <span id="hp-1" class="digit">9</span>
        </div>
        <div class="mp-display">
            <!-- 百の位、十の位、一の位をそれぞれspanで囲む -->
            <span id="mp-100" class="digit">1</span>
            <span id="mp-10" class="digit">4</span>
            <span id="mp-1" class="digit">7</span>
        </div>
    </div>
    <div class="icon" id="keizo-icon" style="top: 58vh;">
        <img class="icon-src" src="assets/icon/Keizo_Normal.png">
        <div class="icon-BG"></div>
        <div id="bar-parent">
            <div class="bar-flame">
                <div id="hp-fill" style="width: 100%"></div>
                <div id="hp-fillBG" style="width: 100%;"></div>
            </div>
            <div class="bar-flame" style="left: 53px; width: 130px;">
                <div id="sp-fill" style="width: 100%; left: 10px;"></div>
                <div id="sp-fillBG" style="width: 100%; left: 10px;"></div>
            </div>
        </div>
        <div class="hp-display">
            <!-- 百の位、十の位、一の位をそれぞれspanで囲む -->
            <span id="hp-100" class="digit">3</span>
            <span id="hp-10" class="digit">0</span>
            <span id="hp-1" class="digit">8</span>
        </div>
        <div class="mp-display">
            <!-- 百の位、十の位、一の位をそれぞれspanで囲む -->
            <span id="mp-100" class="digit">1</span>
            <span id="mp-10" class="digit">2</span>
            <span id="mp-1" class="digit">4</span>
        </div>
    </div>
    <div id="command">
        <div id="moon">
        <div id="moon-command">COMMAND</div>
    </div>
    <div id="command-parent">
        <div id="command-circle"></div>
        <div class="key" style="left: 40px; top: 30px;">W</div>
        <div class="keyword" style="left: -90px; top: 5px; font-size: 40px;">PERSONA
            <div class="subword" style="left: 90px; top: -15px;">スキル</div>
        </div>
        <div class="key" style="left: 10px; top: 60px;">A</div>
        <div class="keyword" style="left: -70px; top: 65px; font-size: 35px;">ITEM
            <div class="subword" style="left: 40px; top: -15px;">アイテム</div>
        </div>
        <div class="key" style="left: 40px; top: 90px;">S</div>
        <div class="key" style="left: 70px; top: 60px;">D</div>
    </div>
</body>
</html>
